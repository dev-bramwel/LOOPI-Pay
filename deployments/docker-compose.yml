name: loopi-pay

services:
  db:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loopipay}
      POSTGRES_USER: ${POSTGRES_USER:-loopipay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopipay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-loopipay} -d ${POSTGRES_DB:-loopipay}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-docker-development-key}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_NAME: ${POSTGRES_DB:-loopipay}
      DATABASE_USER: ${POSTGRES_USER:-loopipay}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-loopipay}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@localhost}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
